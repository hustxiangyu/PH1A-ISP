<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#4a5568" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#a0aec0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font-size: 15px; font-weight: 600; fill: #1a202c; }
      .h     { font-size: 12px; font-weight: 600; fill: #2d3748; }
      .b     { font-size: 11px; font-weight: 400; fill: #2d3748; }
      .c     { font-size: 10px; font-weight: 400; fill: #718096; }
      .lbl   { font-size: 10px; font-weight: 500; fill: #2d3748; }
      .edge  { stroke: #4a5568; stroke-width: 1.1; fill: none; marker-end: url(#arrow); }
      .edge2 { stroke: #a0aec0; stroke-width: 1; fill: none; marker-end: url(#arrow2); stroke-dasharray: 3 2; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="660" fill="#ffffff"/>
  <text x="460" y="26" text-anchor="middle" class="title">PH1A-ISP 系统总体框图</text>
  <text x="460" y="44" text-anchor="middle" class="c">安路 ANLOGIC PH1A（anph1a90）· 实时视频处理平台</text>

  <!-- ========== 输入源 ========== -->
  <rect x="36" y="70" width="168" height="112" rx="8" fill="#ebf8ff" stroke="#3182ce" stroke-width="1"/>
  <text x="120" y="92" text-anchor="middle" class="h">视频源</text>
  <text x="50" y="114" class="b">摄像头 · MIPI CSI-2</text>
  <text x="50" y="132" class="b">HDMI-IN · 1.4b RX</text>
  <text x="50" y="150" class="b">SD 卡图片回显</text>
  <text x="50" y="168" class="c">RAW10 / RAW8 / RGB888</text>

  <!-- ========== 接口预处理 ========== -->
  <rect x="236" y="70" width="168" height="112" rx="8" fill="#e6fffa" stroke="#319795" stroke-width="1"/>
  <text x="320" y="92" text-anchor="middle" class="h">接口与预处理</text>
  <text x="250" y="114" class="b">CSI 解包 / RAW 解包</text>
  <text x="250" y="132" class="b">视频裁剪 bound_cut</text>
  <text x="250" y="150" class="b">RAW → RGB888</text>
  <text x="250" y="168" class="c">csi_unpacket / raw10_unpacket</text>

  <!-- ========== DDR ========== -->
  <rect x="436" y="70" width="188" height="112" rx="8" fill="#fefcbf" stroke="#d69e2e" stroke-width="1"/>
  <text x="530" y="92" text-anchor="middle" class="h">DDR3 帧缓存</text>
  <text x="450" y="114" class="b">自研 FDMA 读写仲裁</text>
  <text x="450" y="132" class="b">多通道读 / 多通道写</text>
  <text x="450" y="150" class="b">uiFDMA + AXI 封装</text>
  <text x="450" y="168" class="c">uiFDMA / uifdma_axi_ddr</text>

  <!-- ========== 控制 ========== -->
  <rect x="236" y="216" width="168" height="88" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="1"/>
  <text x="320" y="238" text-anchor="middle" class="h">控制与交互</text>
  <text x="250" y="260" class="b">按键 / 模式寄存器</text>
  <text x="250" y="278" class="b">UART · RS485</text>
  <text x="250" y="296" class="c">key_delay / uart_rx</text>

  <!-- ========== SD ========== -->
  <rect x="436" y="216" width="188" height="88" rx="8" fill="#faf5ff" stroke="#805ad5" stroke-width="1"/>
  <text x="530" y="238" text-anchor="middle" class="h">SD 卡截图 / 回显</text>
  <text x="450" y="260" class="b">SPI 模式读写 · SD2.0</text>
  <text x="450" y="278" class="b">SDIO 4-bit 高速读</text>
  <text x="450" y="296" class="c">sdcard_sdio_driver</text>

  <!-- ========== ISP 大框 ========== -->
  <rect x="36" y="344" width="848" height="152" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="1.2"/>
  <text x="460" y="366" text-anchor="middle" class="h">ISP 图像处理流水线（各模块可独立开关 / 旁路）</text>

  <!-- ISP row1 -->
  <rect x="52" y="382" width="118" height="44" rx="6" fill="#ffffff" stroke="#68d391" stroke-width="1"/>
  <text x="111" y="400" text-anchor="middle" class="lbl">去马赛克</text>
  <text x="111" y="415" text-anchor="middle" class="c">Demosaic</text>

  <rect x="182" y="382" width="118" height="44" rx="6" fill="#ffffff" stroke="#68d391" stroke-width="1"/>
  <text x="241" y="400" text-anchor="middle" class="lbl">自动白平衡</text>
  <text x="241" y="415" text-anchor="middle" class="c">AWB</text>

  <rect x="312" y="382" width="118" height="44" rx="6" fill="#ffffff" stroke="#68d391" stroke-width="1"/>
  <text x="371" y="400" text-anchor="middle" class="lbl">色彩校正</text>
  <text x="371" y="415" text-anchor="middle" class="c">CCM</text>

  <rect x="442" y="382" width="118" height="44" rx="6" fill="#ffffff" stroke="#68d391" stroke-width="1"/>
  <text x="501" y="400" text-anchor="middle" class="lbl">Gamma / 对比度</text>
  <text x="501" y="415" text-anchor="middle" class="c">LUT</text>

  <rect x="572" y="382" width="118" height="44" rx="6" fill="#ffffff" stroke="#68d391" stroke-width="1"/>
  <text x="631" y="400" text-anchor="middle" class="lbl">锐化</text>
  <text x="631" y="415" text-anchor="middle" class="c">Laplacian EE</text>

  <rect x="702" y="382" width="162" height="44" rx="6" fill="#ffffff" stroke="#68d391" stroke-width="1"/>
  <text x="783" y="400" text-anchor="middle" class="lbl">滤波</text>
  <text x="783" y="415" text-anchor="middle" class="c">均值 / 中值</text>

  <!-- ISP row2 -->
  <rect x="52" y="438" width="118" height="44" rx="6" fill="#ffffff" stroke="#68d391" stroke-width="1"/>
  <text x="111" y="456" text-anchor="middle" class="lbl">二值化</text>
  <text x="111" y="471" text-anchor="middle" class="c">YUV 阈值</text>

  <rect x="182" y="438" width="118" height="44" rx="6" fill="#ffffff" stroke="#68d391" stroke-width="1"/>
  <text x="241" y="456" text-anchor="middle" class="lbl">腐蚀 / 膨胀</text>
  <text x="241" y="471" text-anchor="middle" class="c">形态学</text>

  <rect x="312" y="438" width="118" height="44" rx="6" fill="#ffffff" stroke="#68d391" stroke-width="1"/>
  <text x="371" y="456" text-anchor="middle" class="lbl">边缘 / 轮廓</text>
  <text x="371" y="471" text-anchor="middle" class="c">Sobel / Outline</text>

  <rect x="442" y="438" width="118" height="44" rx="6" fill="#ffffff" stroke="#68d391" stroke-width="1"/>
  <text x="501" y="456" text-anchor="middle" class="lbl">人脸检测</text>
  <text x="501" y="471" text-anchor="middle" class="c">YCbCr 肤色 + 画框</text>

  <rect x="572" y="438" width="118" height="44" rx="6" fill="#ffffff" stroke="#68d391" stroke-width="1"/>
  <text x="631" y="456" text-anchor="middle" class="lbl">水印叠加</text>
  <text x="631" y="471" text-anchor="middle" class="c">ROM Logo</text>

  <rect x="702" y="438" width="162" height="44" rx="6" fill="#ffffff" stroke="#68d391" stroke-width="1"/>
  <text x="783" y="456" text-anchor="middle" class="lbl">无极缩放</text>
  <text x="783" y="471" text-anchor="middle" class="c">最近邻插值 Scaler</text>

  <!-- ISP internal arrows row1 -->
  <line x1="170" y1="404" x2="182" y2="404" class="edge"/>
  <line x1="300" y1="404" x2="312" y2="404" class="edge"/>
  <line x1="430" y1="404" x2="442" y2="404" class="edge"/>
  <line x1="560" y1="404" x2="572" y2="404" class="edge"/>
  <line x1="690" y1="404" x2="702" y2="404" class="edge"/>
  <!-- row1 -> row2 -->
  <line x1="111" y1="426" x2="111" y2="438" class="edge"/>
  <line x1="241" y1="426" x2="241" y2="438" class="edge"/>
  <line x1="371" y1="426" x2="371" y2="438" class="edge"/>
  <line x1="501" y1="426" x2="501" y2="438" class="edge"/>
  <line x1="631" y1="426" x2="631" y2="438" class="edge"/>
  <line x1="783" y1="426" x2="783" y2="438" class="edge"/>
  <!-- ISP internal arrows row2 -->
  <line x1="170" y1="460" x2="182" y2="460" class="edge"/>
  <line x1="300" y1="460" x2="312" y2="460" class="edge"/>
  <line x1="430" y1="460" x2="442" y2="460" class="edge"/>
  <line x1="560" y1="460" x2="572" y2="460" class="edge"/>
  <line x1="690" y1="460" x2="702" y2="460" class="edge"/>

  <!-- ========== 分屏 + 输出 ========== -->
  <rect x="36" y="528" width="236" height="84" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1"/>
  <text x="154" y="550" text-anchor="middle" class="h">分屏显示</text>
  <text x="50" y="572" class="b">多路源拼接 / 前后对比</text>
  <text x="50" y="590" class="b">四分屏 · 画中画</text>
  <text x="50" y="606" class="c">div_ctrl / div_data</text>

  <rect x="308" y="528" width="196" height="84" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1"/>
  <text x="406" y="550" text-anchor="middle" class="h">显示输出</text>
  <text x="322" y="572" class="b">HDMI 1.4b TX</text>
  <text x="322" y="590" class="b">1920×1080 · RGB888</text>
  <text x="322" y="606" class="c">ph1a_hdmi_tx</text>

  <rect x="540" y="528" width="344" height="84" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1"/>
  <text x="712" y="550" text-anchor="middle" class="h">开发与部署</text>
  <text x="554" y="572" class="b">安路 TD · 综合 / 布局布线 / 比特流</text>
  <text x="554" y="590" class="b">约束：pin.adc + timing.sdc</text>
  <text x="554" y="606" class="c">IP：DDR3 · MIPI D-PHY · HDMI · FIFO · PLL</text>

  <!-- ========== 数据通路连线 ========== -->
  <!-- 源 -> 接口 -->
  <line x1="204" y1="126" x2="236" y2="126" class="edge"/>
  <!-- 接口 -> DDR -->
  <line x1="404" y1="126" x2="436" y2="126" class="edge"/>
  <!-- DDR -> ISP -->
  <path d="M 624 126 C 700 126, 760 200, 760 300 C 760 330, 720 344, 660 344" class="edge"/>
  <text x="772" y="250" class="c">帧数据</text>
  <!-- ISP -> 分屏 -->
  <path d="M 180 496 C 180 512, 154 512, 154 528" class="edge"/>
  <!-- 分屏 -> HDMI -->
  <line x1="272" y1="570" x2="308" y2="570" class="edge"/>
  <!-- ISP -> HDMI（缩放后） -->
  <path d="M 783 482 C 783 510, 500 510, 470 528" class="edge"/>
  <!-- SD <-> DDR -->
  <line x1="530" y1="182" x2="530" y2="216" class="edge2"/>
  <!-- 控制 -> 接口 -->
  <line x1="320" y1="216" x2="320" y2="182" class="edge2"/>
  <!-- 控制 -> ISP（配置） -->
  <path d="M 404 260 C 430 260, 440 330, 440 344" class="edge2"/>
  <text x="446" y="300" class="c">寄存器配置</text>

  <!-- legend -->
  <line x1="36" y1="632" x2="884" y2="632" stroke="#e2e8f0" stroke-width="1"/>
  <text x="460" y="650" text-anchor="middle" class="c">实线 = 视频数据通路　　虚线 = 控制 / 配置通路　　各 ISP 模块可通过寄存器独立启用或旁路</text>
</svg>
